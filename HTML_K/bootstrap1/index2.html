<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>



    <!--GRID-->
    <!--up to 12 columns across the page.-->

    <div class="container-lg my-5"> <!--container-->
        <h2>Basic grid</h2>
        <div class="row"> <!--row-->
            <div class="col"> <!--column-->
                <div class="p-5 bg-primary text-light">Col 1</div><!--content-->
            </div>
            <div class="col">
                <div class="p-5 bg-primary text-light">Col 2</div>
            </div>
            <div class="col">
                <div class="p-5 bg-primary text-light">Col 3</div>
            </div>
            <div class="col">
                <div class="p-5 bg-primary text-light">Col 4</div>
            </div>
        </div>
    </div>


    <div class="container-lg my-5">
        <h2>Column width</h2>
        <div class="row">
            <div class="col-6"> <!--col size -->
                <div class="p-5 bg-primary text-light">Col 1</div>
            </div>
            <div class="col-3">
                <div class="p-5 bg-primary text-light">Col 2</div>
            </div>
            <div class="col-3">
                <div class="p-5 bg-primary text-light">Col 3</div>
            </div>
        </div>
    </div>


    <div class="container-lg my-5">
        <h2>Responsive column width</h2>
        <div class="row">
            <div class="col-sm-4 col-lg-6"> <!--responsive col size-->
                <div class="p-5 bg-primary text-light">Col 1</div>
            </div>
            <div class="col-sm-4 col-lg-3">
                <div class="p-5 bg-primary text-light">Col 2</div>
            </div>
            <div class="col-sm-4 col-lg-3">
                <div class="p-5 bg-primary text-light">Col 3</div>
            </div>
        </div>
    </div>


    <div class="container-lg my-5">
        <h2>Justifying columns</h2>
        <div class="row justify-content-center"> <!--Justify-->
            <div class="col-md-3">
                <div class="p-5 bg-primary text-light">Col 1</div>
            </div>
            <div class="col-md-3">
                <div class="p-5 bg-primary text-light">Col 2</div>
            </div>
            <div class="col-md-3">
                <div class="p-5 bg-primary text-light">Col 3</div>
            </div>
        </div>
    </div>




 
    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
